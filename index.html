<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Эффект Френеля</title>
  <link rel="stylesheet" href="./styles.css?v=43">
  <script src="./gallery-core.js?v=5"></script>
  <style>
    /* Стили для подписи в модальном окне */
    .modal {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .modal-caption {
      margin-top: 1rem;
      font-family: inherit;
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.75);
      text-align: center;
      pointer-events: none;
      text-transform: lowercase;
    }
  </style>
</head>
<body class="page-index">

  <!-- Кнопка темы (Солнце / Луна) -->
  <button class="theme-toggle-btn visible" id="themeToggleBtn" aria-label="Сменить тему">
    <svg class="icon-sun" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M12 2v2"></path>
      <path d="M12 20v2"></path>
      <path d="m4.93 4.93 1.41 1.41"></path>
      <path d="m17.66 17.66 1.41 1.41"></path>
      <path d="M2 12h2"></path>
      <path d="M20 12h2"></path>
      <path d="m6.34 17.66-1.41 1.41"></path>
      <path d="m19.07 4.93-1.41 1.41"></path>
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24">
      <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
    </svg>
  </button>

  <!-- Кнопка смены ритма/волны -->
  <button class="pattern-btn visible" id="patternBtn" aria-label="Сменить ритм раскладки">
    <svg viewBox="0 0 24 24">
      <path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"></path>
      <path d="M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"></path>
      <path d="M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"></path>
    </svg>
  </button>

  <!-- Кнопка перехода в стрим -->
  <a href="stream.html" class="stream-nav-btn visible" id="streamNavBtn" aria-label="Режим наблюдения">
    <svg viewBox="0 0 24 24">
      <circle cx="6" cy="15" r="4"></circle>
      <circle cx="18" cy="15" r="4"></circle>
      <path d="M14 15a2 2 0 0 0-2-2 2 2 0 0 0-2 2"></path>
      <path d="M2.5 13 5 7c.7-1.3 1.4-2 3-2"></path>
      <path d="M21.5 13 19 7c-.7-1.3-1.5-2-3-2"></path>
    </svg>
  </a>

  <!-- Кнопка «Наверх» на 3-й позиции справа -->
  <button class="scroll-top-btn" id="scrollTopBtn" aria-label="Наверх страницы">
    <svg viewBox="0 0 24 24">
      <line x1="12" y1="19" x2="12" y2="5"></line>
      <polyline points="5 12 12 5 19 12"></polyline>
    </svg>
  </button>

  <header>
    <div class="title-row">
      <h1 id="titleContainer"><span id="titleText" class="title-text-box">...</span></h1>
      <!-- Чистый текстовый переключатель RU / EN -->
      <button class="lang-switch-btn" id="langSwitchBtn" aria-label="Сменить язык">
        <span class="lang-ru">RU</span>
        <span class="lang-en">EN</span>
      </button>
    </div>
    <div id="desc" class="description"></div>
  </header>

  <main class="gallery-grid" id="gallery"></main>

  <footer id="footer" class="site-footer"></footer>

  <!-- Модальное окно фокуса -->
  <div class="modal" id="modal" aria-hidden="true">
    <img id="modalImg" src="" alt="Фокус на изображении">
    <div class="modal-caption" id="modalCaption"></div>
  </div>

  <script>
    const gallery = document.getElementById('gallery');
    const pageTitleText = document.getElementById('titleText');
    const pageDesc = document.getElementById('desc');
    const pageFooter = document.getElementById('footer');
    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modalImg');
    const modalCaption = document.getElementById('modalCaption');
    const streamNavBtn = document.getElementById('streamNavBtn');
    const patternBtn = document.getElementById('patternBtn');
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const langSwitchBtn = document.getElementById('langSwitchBtn');
    const scrollTopBtn = document.getElementById('scrollTopBtn');

    // === ПЕРЕКЛЮЧЕНИЕ ТЕМЫ ===
    let currentRawData = null;
    let savedTheme = localStorage.getItem('fresnel_theme');
    let isDarkMode = savedTheme === 'dark';
    let computedGradient = '';

    function applyTheme() {
      if (isDarkMode) {
        document.body.classList.add('theme-dark');
        themeToggleBtn.setAttribute('aria-label', 'Включить светлую тему');
        if (computedGradient) {
          document.body.style.backgroundImage = computedGradient;
          document.documentElement.style.backgroundImage = computedGradient;
        }
      } else {
        document.body.classList.remove('theme-dark');
        themeToggleBtn.setAttribute('aria-label', 'Включить тему с градиентом');
        document.body.style.backgroundImage = 'none';
        document.documentElement.style.backgroundImage = 'none';
      }
    }

    if (isDarkMode) {
      document.body.classList.add('theme-dark');
    }

    themeToggleBtn.addEventListener('click', () => {
      isDarkMode = !isDarkMode;
      localStorage.setItem('fresnel_theme', isDarkMode ? 'dark' : 'light');
      applyTheme();
    });

    patternBtn.addEventListener('click', () => {
      GalleryCore.nextPattern();
    });

    scrollTopBtn.addEventListener('click', () => {
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    });

    function checkBottomPosition() {
      const scrollPos = window.innerHeight + window.scrollY;
      const threshold = document.documentElement.scrollHeight - 70;
      
      if (scrollPos >= threshold) {
        streamNavBtn.classList.remove('visible');
        scrollTopBtn.classList.add('visible');
      } else {
        streamNavBtn.classList.add('visible');
        scrollTopBtn.classList.remove('visible');
      }
    }

    window.addEventListener('scroll', checkBottomPosition, { passive: true });

    function buildDynamicGradient(data, pairCount) {
      const colors = GalleryCore.extractColors(data);
      if (colors.length === 0) return '';
      if (colors.length === 1) return colors[0];

      const totalStopsNeeded = Math.max(pairCount + 3, colors.length);
      const stopColors = [];
      for (let i = 0; i < totalStopsNeeded; i++) {
        stopColors.push(colors[i % colors.length]);
      }

      const stopsWithPercents = stopColors.map((color, index) => {
        const percent = Math.round((index / (totalStopsNeeded - 1)) * 100);
        return `${color} ${percent}%`;
      });

      return `linear-gradient(168deg, ${stopsWithPercents.join(', ')})`;
    }

    function openModal(src) {
      modalImg.src = src;
      const fileName = src.split('/').pop().replace(/\.[^/.]+$/, '');
      modalCaption.textContent = fileName;

      modal.classList.add('active');
      modal.setAttribute('aria-hidden', 'false');
      document.body.classList.add('modal-open');
    }

    function closeModal() {
      modal.classList.remove('active');
      modal.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('modal-open');
      setTimeout(() => {
        if (!modal.classList.contains('active')) {
          modalImg.src = '';
          modalCaption.textContent = '';
        }
      }, 350);
    }

    const glassesIconSvg = `<svg class="footer-glasses-icon" viewBox="0 0 24 24"><circle cx="6" cy="15" r="4"></circle><circle cx="18" cy="15" r="4"></circle><path d="M14 15a2 2 0 0 0-2-2 2 2 0 0 0-2 2"></path><path d="M2.5 13 5 7c.7-1.3 1.4-2 3-2"></path><path d="M21.5 13 19 7c-.7-1.3-1.5-2-3-2"></path></svg>`;

    // === ПАРСИНГ И РЕНДЕР ТЕКСТОВ ===
    let currentLang = localStorage.getItem('fresnel_lang') || 'ru';
    let enTextData = null;

    function renderHeaderAndDesc(rawTitle, rawDesc) {
      if (rawTitle) {
        const cleanTitle = rawTitle.replace(/<\/?[^>]+(>|$)/g, '').replace(/\*\*(.*?)\*\*/g, '$1').trim();
        document.title = cleanTitle;

        pageTitleText.innerHTML = rawTitle
          .replace(/<strong[^>]*>(.*?)<\/strong>/gi, '<span class="title-accent">$1</span>')
          .replace(/<b[^>]*>(.*?)<\/b>/gi, '<span class="title-accent">$1</span>')
          .replace(/\*\*(.*?)\*\*/g, '<span class="title-accent">$1</span>');
      }

      if (rawDesc) {
        let descHtml = rawDesc
          .replace(/<strong[^>]*>(.*?)<\/strong>/gi, '<span class="highlight">$1</span>')
          .replace(/<b[^>]*>(.*?)<\/b>/gi, '<span class="highlight">$1</span>')
          .replace(/\*\*(.*?)\*\*/g, '<span class="highlight">$1</span>');

        const paragraphs = descHtml.split(/\n\s*\n/);
        if (paragraphs.length > 1) {
          const lastIdx = paragraphs.length - 1;
          const lastP = paragraphs[lastIdx].trim();
          if (lastP.includes('/') || /Антон|Anton|Rick/i.test(lastP)) {
            paragraphs[lastIdx] = `<span class="author-line">${lastP}</span>`;
          }
          descHtml = paragraphs.join('<br><br>');
        } else {
          descHtml = descHtml.replace(/\n/g, '<br>');
        }

        pageDesc.innerHTML = descHtml;
      }
    }

    function renderFooter(rawFooter) {
      const currentYear = new Date().getFullYear();
      let footerStr = rawFooter && rawFooter.trim() 
        ? rawFooter.trim()
        : (currentLang === 'en'
            ? `[version without text - for observation](stream.html)\n\n[Telegram](https://t.me/RickAntilles) / [Instagram](https://instagram.com/mefty)\n\n© ${currentYear} ANTON IVCHENKO / RICK ANTILLES. ALL RIGHTS RESERVED.`
            : `[версия без текста — для наблюдения](stream.html)\n\n[Telegram](https://t.me/RickAntilles) / [Instagram](https://instagram.com/mefty)\n\n© ${currentYear} Антон Ивченко / Rick Antilles. All rights reserved.`);

      footerStr = footerStr.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (match, text, url) => {
        const isExternal = /^https?:\/\//i.test(url);
        const targetAttr = isExternal ? ' target="_blank" rel="noopener noreferrer"' : '';
        
        let formattedText = text;
        if (url.includes('stream.html') || /наблюден|observ/i.test(text)) {
          formattedText = text.replace(/\s*[-—–]\s*/, ` ${glassesIconSvg} `);
        }
        
        return `<a href="${url}"${targetAttr}>${formattedText}</a>`;
      });

      footerStr = footerStr.replace(/\[year\]/gi, currentYear).replace(/\b20\d{2}\b/g, currentYear);

      const footerParts = footerStr.split(/\n\s*\n/);
      let modeHtml = '';
      let contactsHtml = '';
      let copyrightHtml = '';

      if (footerParts.length >= 3) {
        modeHtml = footerParts[0].trim();
        contactsHtml = footerParts[1].trim();
        copyrightHtml = footerParts.slice(2).join('<br>').trim();
      } else {
        contactsHtml = footerParts[0] || '';
        copyrightHtml = footerParts.slice(1).join('<br>').trim();
      }

      pageFooter.innerHTML = `
        ${modeHtml ? `<div class="footer-mode-link">${modeHtml}</div>` : ''}
        <div class="footer-contacts">${contactsHtml}</div>
        <div class="footer-copyright">${copyrightHtml}</div>
      `;
    }

    async function parseEngMarkdown() {
      if (enTextData) return enTextData;
      try {
        const res = await fetch('content-eng.md?v=' + Date.now());
        if (!res.ok) throw new Error('content-eng.md not found');
        const text = await res.text();

        let cleanText = text;
        let title = 'The Fresnel Effect';

        const matchTitle = text.match(/^#\s+(.+)$/m);
        if (matchTitle) {
          title = matchTitle[1].trim();
          cleanText = text.replace(/^#\s+(.+)$/m, '').trim();
        } else {
          const parts = text.split(/\n\s*\n/);
          if (parts[0] && parts[0].length < 60) {
            title = parts[0].trim();
            cleanText = parts.slice(1).join('\n\n').trim();
          }
        }

        let description = cleanText;
        let footer = '';

        if (cleanText.includes('---')) {
          const hrParts = cleanText.split(/\n\s*---\s*\n/);
          description = hrParts[0].trim();
          footer = hrParts.slice(1).join('\n\n').trim();
        } else if (cleanText.includes('***')) {
          const hrParts = cleanText.split(/\n\s*\*\*\*\s*\n/);
          description = hrParts[0].trim();
          footer = hrParts.slice(1).join('\n\n').trim();
        } else {
          const streamIdx = cleanText.search(/\[.*?\]\(stream\.html\)/i);
          if (streamIdx !== -1) {
            description = cleanText.slice(0, streamIdx).trim();
            footer = cleanText.slice(streamIdx).trim();
          }
        }

        enTextData = { title, description, footer };
        return enTextData;
      } catch (err) {
        console.warn('Не удалось загрузить content-eng.md', err);
        return null;
      }
    }

    async function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('fresnel_lang', lang);
      langSwitchBtn.classList.toggle('is-eng', lang === 'en');

      if (lang === 'en') {
        const enData = await parseEngMarkdown();
        if (enData) {
          renderHeaderAndDesc(enData.title, enData.description);
          renderFooter(enData.footer);
        }
      } else {
        if (currentRawData) {
          renderHeaderAndDesc(currentRawData.title, currentRawData.description);
          renderFooter(currentRawData.footer);
        }
      }
    }

    langSwitchBtn.addEventListener('click', () => {
      setLanguage(currentLang === 'ru' ? 'en' : 'ru');
    });

    async function init() {
      try {
        const res = await fetch('data.json?v=' + Date.now());
        const data = await res.json();
        currentRawData = data;

        await setLanguage(currentLang);

        gallery.innerHTML = '';
        const rawImages = data.images || [];
        const images = GalleryCore.sortImages(rawImages);
        const allColors = GalleryCore.extractColors(data);
        const photoColors = GalleryCore.getPhotoPalette(allColors);

        images.forEach((item, index) => {
          const el = document.createElement('div');
          el.className = 'photo-item';

          GalleryCore.applyCardLayout(el, index, photoColors);

          el.innerHTML = `<img src="${item.src}" alt="" loading="lazy">`;

          el.querySelector('img').addEventListener('click', () => {
            openModal(item.src);
          });

          gallery.appendChild(el);
        });

        const pairCount = Math.ceil(images.length / 2);
        computedGradient = buildDynamicGradient(data, pairCount);
        applyTheme();

      } catch (e) {
        console.error("Ошибка загрузки данных:", e);
      }
    }

    modal.addEventListener('click', closeModal);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('active')) {
        closeModal();
      }
    });

    init();
  </script>
</body>
</html>
