<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Галерея</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1 id="title">...</h1>
    <div id="desc" class="description"></div>
  </header>

  <main class="gallery-grid" id="gallery"></main>

  <div class="modal" id="modal">
    <img id="modalImg" src="" alt="Fullscreen">
  </div>

  <script>
    const gallery = document.getElementById('gallery');
    const pageTitle = document.getElementById('title');
    const pageDesc = document.getElementById('desc');
    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modalImg');

    // 20 ритмов вертикального смещения пар
    const offsets = [
      7, 3.5, 11, -6, 8, 2.5, 10.5, -4, 6.5, 12,
      4, 8.5, -7, 3, 11.5, 6, -5, 9, 3.5, 7.5
    ];

    function applyDynamicGradient(colors, pairCount) {
      if (!colors || colors.length === 0) return;
      if (colors.length === 1) {
        document.body.style.backgroundColor = colors[0];
        return;
      }

      // Точки привязки: 1 (верх) + 1 (текст) + N (пар) + 1 (низ/подвал)
      const totalStopsNeeded = Math.max(pairCount + 3, colors.length);

      const stopColors = [];
      for (let i = 0; i < totalStopsNeeded; i++) {
        stopColors.push(colors[i % colors.length]);
      }

      const stopsWithPercents = stopColors.map((color, index) => {
        const percent = Math.round((index / (totalStopsNeeded - 1)) * 100);
        return `${color} ${percent}%`;
      });

      // Единый мягкий диагональный угол 168deg
      document.body.style.background = `linear-gradient(168deg, ${stopsWithPercents.join(', ')})`;
    }

    async function init() {
      try {
        const res = await fetch('data.json?v=' + Date.now());
        const data = await res.json();

        // 1. Тексты
        if (data.title) {
          pageTitle.textContent = data.title;
          document.title = data.title;
        }
        if (data.description) {
          pageDesc.innerHTML = data.description.replace(/\n/g, '<br>');
        }

        // 2. Карточки 9:16 со смещением
        gallery.innerHTML = '';
        const images = data.images || [];
        images.forEach((item, index) => {
          const el = document.createElement('div');
          el.className = 'photo-item';

          const pairIndex = Math.floor(index / 2);
          const shiftValue = offsets[pairIndex % offsets.length];

          let itemOffset = 0;
          if (index % 2 === 0) {
            itemOffset = shiftValue < 0 ? Math.abs(shiftValue) : 0;
          } else {
            itemOffset = shiftValue > 0 ? shiftValue : 0;
          }

          el.style.setProperty('--offset', `${itemOffset}rem`);
          el.innerHTML = `<img src="${item.src}" alt="" loading="lazy">`;

          el.querySelector('img').addEventListener('click', () => {
            modalImg.src = item.src;
            modal.classList.add('active');
          });

          gallery.appendChild(el);
        });

        // 3. Вычисление градиента
        const pairCount = Math.ceil(images.length / 2);
        const colorsList = data.colors && data.colors.length > 0 ? data.colors : (data.gradient ? [data.gradient] : []);
        applyDynamicGradient(colorsList, pairCount);

      } catch (e) {
        console.error("Ошибка инициализации:", e);
      }
    }

    modal.addEventListener('click', () => modal.classList.remove('active'));
    init();
  </script>
</body>
</html>
