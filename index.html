<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Галерея</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1 id="title">...</h1>
    <div id="desc" class="description"></div>
  </header>

  <main class="gallery-grid" id="gallery"></main>

  <div class="modal" id="modal">
    <img id="modalImg" src="" alt="Fullscreen">
  </div>

  <script>
    const gallery = document.getElementById('gallery');
    const pageTitle = document.getElementById('title');
    const pageDesc = document.getElementById('desc');
    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modalImg');

    // Наш паттерн сдвигов на 20 пар (значения в rem)
    // Положительное число = правое фото ниже левого
    // Отрицательное число = левое фото ниже правого (зеркальный шаг)
    const offsets = [
      7,    // Пара 01
      3.5,  // Пара 02
      11,   // Пара 03
      -6,   // Пара 04 (зеркало)
      8,    // Пара 05
      2.5,  // Пара 06
      10.5, // Пара 07
      -4,   // Пара 08 (зеркало)
      6.5,  // Пара 09
      12,   // Пара 10
      4,    // Пара 11
      8.5,  // Пара 12
      -7,   // Пара 13 (зеркало)
      3,    // Пара 14
      11.5, // Пара 15
      6,    // Пара 16
      -5,   // Пара 17 (зеркало)
      9,    // Пара 18
      3.5,  // Пара 19
      7.5   // Пара 20
    ];

    async function init() {
      try {
        const res = await fetch('data.json?v=' + Date.now());
        const data = await res.json();

        // 1. Применяем градиент
        if (data.gradient && data.gradient !== "none") {
          document.body.style.background = data.gradient;
        }

        // 2. Заголовки и текст
        if (data.title) {
          pageTitle.textContent = data.title;
          document.title = data.title;
        }
        if (data.description) {
          pageDesc.innerHTML = data.description.replace(/\n/g, '<br>');
        }

        // 3. Вывод фото с динамическим ритмическим сдвигом
        gallery.innerHTML = '';
        (data.images || []).forEach((item, index) => {
          const el = document.createElement('div');
          el.className = 'photo-item';

          // Вычисляем номер пары (0, 1, 2...)
          const pairIndex = Math.floor(index / 2);
          // Берем сдвиг из массива с зацикливанием по остатку от деления
          const shiftValue = offsets[pairIndex % offsets.length];

          // Для четного индекса (левое фото) или нечетного (правое фото)
          let itemOffset = 0;
          if (index % 2 === 0) {
            // Если сдвиг отрицательный — опускаем левое фото
            itemOffset = shiftValue < 0 ? Math.abs(shiftValue) : 0;
          } else {
            // Если положительный — опускаем правое фото
            itemOffset = shiftValue > 0 ? shiftValue : 0;
          }

          // Передаем точное смещение в CSS-переменную
          el.style.setProperty('--offset', `${itemOffset}rem`);

          el.innerHTML = `<img src="${item.src}" alt="" loading="lazy">`;

          el.querySelector('img').addEventListener('click', () => {
            modalImg.src = item.src;
            modal.classList.add('active');
          });

          gallery.appendChild(el);
        });

      } catch (e) {
        console.error("Ошибка загрузки:", e);
      }
    }

    modal.addEventListener('click', () => modal.classList.remove('active'));
    init();
  </script>
</body>
</html>
