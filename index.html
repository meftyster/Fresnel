<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Галерея</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1 id="title">...</h1>
    <div id="desc" class="description"></div>
  </header>

  <main class="gallery-grid" id="gallery"></main>

  <div class="modal" id="modal">
    <img id="modalImg" src="" alt="Fullscreen">
  </div>

  <script>
    const gallery = document.getElementById('gallery');
    const pageTitle = document.getElementById('title');
    const pageDesc = document.getElementById('desc');
    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modalImg');

    // 20 ритмов смещения
    const offsets = [
      7, 3.5, 11, -6, 8, 2.5, 10.5, -4, 6.5, 12,
      4, 8.5, -7, 3, 11.5, 6, -5, 9, 3.5, 7.5
    ];

    function applyDynamicGradient(data, pairCount) {
      let colors = [];

      // 1. Проверяем, в каком виде пришли цвета
      if (Array.isArray(data.colors) && data.colors.length > 0) {
        colors = data.colors;
      } else if (typeof data.gradient === 'string' && data.gradient.includes('#')) {
        // Если в data.json старая строка — аккуратно достаем из нее все HEX-коды
        colors = data.gradient.match(/#[a-fA-F0-9]{3,8}/g) || [];
      }

      if (colors.length === 0) return;

      if (colors.length === 1) {
        document.body.style.backgroundColor = colors[0];
        return;
      }

      // Привязка: старт + шапка/текст + пары + подвал
      const totalStopsNeeded = Math.max(pairCount + 3, colors.length);

      const stopColors = [];
      for (let i = 0; i < totalStopsNeeded; i++) {
        stopColors.push(colors[i % colors.length]);
      }

      const stopsWithPercents = stopColors.map((color, index) => {
        const percent = Math.round((index / (totalStopsNeeded - 1)) * 100);
        return `${color} ${percent}%`;
      });

      // Применяем градиент под углом 168deg
      const gradientStyle = `linear-gradient(168deg, ${stopsWithPercents.join(', ')})`;
      document.body.style.backgroundImage = gradientStyle;
      document.documentElement.style.backgroundImage = gradientStyle;
    }

    async function init() {
      try {
        const res = await fetch('data.json?v=' + Date.now());
        const data = await res.json();

        // Тексты
        if (data.title) {
          pageTitle.textContent = data.title;
          document.title = data.title;
        }
        if (data.description) {
          pageDesc.innerHTML = data.description.replace(/\n/g, '<br>');
        }

        // Фотографии
        gallery.innerHTML = '';
        const images = data.images || [];
        images.forEach((item, index) => {
          const el = document.createElement('div');
          el.className = 'photo-item';

          const pairIndex = Math.floor(index / 2);
          const shiftValue = offsets[pairIndex % offsets.length];

          let itemOffset = 0;
          if (index % 2 === 0) {
            itemOffset = shiftValue < 0 ? Math.abs(shiftValue) : 0;
          } else {
            itemOffset = shiftValue > 0 ? shiftValue : 0;
          }

          el.style.setProperty('--offset', `${itemOffset}rem`);
          el.innerHTML = `<img src="${item.src}" alt="" loading="lazy">`;

          el.querySelector('img').addEventListener('click', () => {
            modalImg.src = item.src;
            modal.classList.add('active');
          });

          gallery.appendChild(el);
        });

        // Наложение градиента
        const pairCount = Math.ceil(images.length / 2);
        applyDynamicGradient(data, pairCount);

      } catch (e) {
        console.error("Ошибка загрузки:", e);
      }
    }

    modal.addEventListener('click', () => modal.classList.remove('active'));
    init();
  </script>
</body>
</html>
