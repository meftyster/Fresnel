<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Эффект Френеля — Поток</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .stream-viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      cursor: grab;
    }

    .stream-viewport:active {
      cursor: grabbing;
    }

    .stream-track {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      will-change: transform;
    }
  </style>
</head>
<body class="page-stream">

  <!-- Кнопка «назад» (слева) -->
  <a href="index.html" class="back-btn" id="backBtn" aria-label="Назад к галерее">
    <svg viewBox="0 0 24 24">
      <line x1="19" y1="12" x2="5" y2="12"></line>
      <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
  </a>

  <!-- Кнопка звука (справа) -->
  <button class="sound-btn visible playing" id="soundBtn" aria-label="Выключить звук">
    <svg class="icon-mute" viewBox="0 0 24 24">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <line x1="23" y1="9" x2="17" y2="15"></line>
      <line x1="17" y1="9" x2="23" y2="15"></line>
    </svg>
    <svg class="icon-sound" viewBox="0 0 24 24">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
    </svg>
  </button>

  <!-- Трек виртуального потока -->
  <div class="stream-viewport" id="viewport">
    <div class="stream-track" id="track">
      <div class="stream-group" id="groupOriginal"></div>
      <div class="stream-group" id="groupClone" aria-hidden="true"></div>
    </div>
  </div>

  <!-- Модальное окно фокуса -->
  <div class="modal" id="modal" aria-hidden="true">
    <img id="modalImg" src="" alt="Фокус на изображении">
  </div>

  <script>
    const viewport = document.getElementById('viewport');
    const track = document.getElementById('track');
    const groupOriginal = document.getElementById('groupOriginal');
    const groupClone = document.getElementById('groupClone');
    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modalImg');
    const backBtn = document.getElementById('backBtn');
    const soundBtn = document.getElementById('soundBtn');

    // === АУДИОМОДУЛЬ С КРОССФЕЙДОМ (stream.html) ===
    const TARGET_VOLUME = 0.65;
    const FADE_TIME = 1.8;
    const CROSSFADE_TIME = 2.5;

    let audioCtx = null;
    let masterGain = null;
    let playerA = null;
    let playerB = null;
    let gainA = null;
    let gainB = null;
    let isPlaying = false;
    let userManuallyMuted = false;
    let crossfadeTimer = null;
    let activePlayer = 'A';
    let currentAudioSrc = 'batlicsea.mp3';

    function initAudioGraph() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(0, audioCtx.currentTime);
        masterGain.connect(audioCtx.destination);

        playerA = new Audio(currentAudioSrc);
        playerB = new Audio(currentAudioSrc);
        playerA.preload = 'auto';
        playerB.preload = 'auto';

        const sourceA = audioCtx.createMediaElementSource(playerA);
        const sourceB = audioCtx.createMediaElementSource(playerB);

        gainA = audioCtx.createGain();
        gainB = audioCtx.createGain();

        sourceA.connect(gainA).connect(masterGain);
        sourceB.connect(gainB).connect(masterGain);
      }
    }

    function scheduleCrossfade(fromPlayer, toPlayer, fromGain, toGain) {
      if (!isPlaying) return;

      const duration = fromPlayer.duration;
      if (!duration || isNaN(duration)) {
        fromPlayer.addEventListener('loadedmetadata', () => {
          scheduleCrossfade(fromPlayer, toPlayer, fromGain, toGain);
        }, { once: true });
        return;
      }

      const timeLeft = duration - fromPlayer.currentTime;
      const timeUntilFade = Math.max(0, (timeLeft - CROSSFADE_TIME) * 1000);

      clearTimeout(crossfadeTimer);
      crossfadeTimer = setTimeout(() => {
        if (!isPlaying) return;

        toPlayer.currentTime = 0;
        toGain.gain.setValueAtTime(0, audioCtx.currentTime);

        toPlayer.play().then(() => {
          const now = audioCtx.currentTime;

          toGain.gain.cancelScheduledValues(now);
          fromGain.gain.cancelScheduledValues(now);

          toGain.gain.setValueAtTime(0, now);
          toGain.gain.linearRampToValueAtTime(1.0, now + CROSSFADE_TIME);

          fromGain.gain.setValueAtTime(1.0, now);
          fromGain.gain.linearRampToValueAtTime(0, now + CROSSFADE_TIME);

          activePlayer = activePlayer === 'A' ? 'B' : 'A';

          setTimeout(() => {
            fromPlayer.pause();
            fromPlayer.currentTime = 0;
            if (activePlayer === 'B') {
              scheduleCrossfade(playerB, playerA, gainB, gainA);
            } else {
              scheduleCrossfade(playerA, playerB, gainA, gainB);
            }
          }, CROSSFADE_TIME * 1000);
        }).catch(err => console.warn(err));

      }, timeUntilFade);
    }

    function playAudio() {
      if (userManuallyMuted) return;
      initAudioGraph();

      // Гарантируем разблокировку AudioContext
      const resumePromise = audioCtx.state === 'suspended' ? audioCtx.resume() : Promise.resolve();

      resumePromise.then(() => {
        gainA.gain.setValueAtTime(1.0, audioCtx.currentTime);
        gainB.gain.setValueAtTime(0, audioCtx.currentTime);
        activePlayer = 'A';

        playerA.play().then(() => {
          isPlaying = true;
          soundBtn.classList.add('playing');
          soundBtn.setAttribute('aria-label', 'Выключить звук');

          const now = audioCtx.currentTime;
          masterGain.gain.cancelScheduledValues(now);
          masterGain.gain.setValueAtTime(masterGain.gain.value, now);
          masterGain.gain.linearRampToValueAtTime(TARGET_VOLUME, now + FADE_TIME);

          scheduleCrossfade(playerA, playerB, gainA, gainB);
          removeUnlockListeners();
        }).catch(() => {
          // Автоплей заблокирован браузером до первого действия пользователя
          isPlaying = false;
          attachUnlockListeners();
        });
      }).catch(() => {
        isPlaying = false;
        attachUnlockListeners();
      });
    }

    function pauseAudio() {
      if (!audioCtx) return;
      isPlaying = false;
      userManuallyMuted = true;
      clearTimeout(crossfadeTimer);
      soundBtn.classList.remove('playing');
      soundBtn.setAttribute('aria-label', 'Включить звук');
      removeUnlockListeners();

      const now = audioCtx.currentTime;
      masterGain.gain.cancelScheduledValues(now);
      masterGain.gain.setValueAtTime(masterGain.gain.value, now);
      masterGain.gain.linearRampToValueAtTime(0, now + FADE_TIME);

      setTimeout(() => {
        if (!isPlaying) {
          playerA.pause();
          playerB.pause();
          playerA.currentTime = 0;
          playerB.currentTime = 0;
        }
      }, FADE_TIME * 1000);
    }

    // Слушатель жестов для разблокировки звука
    function onUserGesture() {
      if (!userManuallyMuted && !isPlaying) {
        playAudio();
      }
    }

    function attachUnlockListeners() {
      window.addEventListener('mousemove', onUserGesture, { once: true });
      window.addEventListener('wheel', onUserGesture, { once: true, passive: true });
      window.addEventListener('touchstart', onUserGesture, { once: true, passive: true });
      window.addEventListener('pointerdown', onUserGesture, { once: true });
    }

    function removeUnlockListeners() {
      window.removeEventListener('mousemove', onUserGesture);
      window.removeEventListener('wheel', onUserGesture);
      window.removeEventListener('touchstart', onUserGesture);
      window.removeEventListener('pointerdown', onUserGesture);
    }

    // Попытка автозапуска при загрузке
    playAudio();

    soundBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!isPlaying) {
        userManuallyMuted = false;
        playAudio();
      } else {
        pauseAudio();
      }
    });

    let uiTimeout = null;
    let isCursorOverUI = false;

    function showUI() {
      backBtn.classList.add('visible');
      soundBtn.classList.add('visible');
      clearTimeout(uiTimeout);
      
      if (!isCursorOverUI) {
        uiTimeout = setTimeout(() => {
          backBtn.classList.remove('visible');
          soundBtn.classList.remove('visible');
        }, 2500);
      }
    }

    uiTimeout = setTimeout(() => {
      if (!isCursorOverUI) {
        soundBtn.classList.remove('visible');
      }
    }, 2500);

    window.addEventListener('mousemove', showUI);
    window.addEventListener('touchstart', showUI, { passive: true });
    window.addEventListener('wheel', showUI, { passive: true });

    [backBtn, soundBtn].forEach(btn => {
      btn.addEventListener('mouseenter', () => {
        isCursorOverUI = true;
        clearTimeout(uiTimeout);
        backBtn.classList.add('visible');
        soundBtn.classList.add('visible');
      });

      btn.addEventListener('mouseleave', () => {
        isCursorOverUI = false;
        showUI();
      });
    });

    const offsets = [
      7, 3.5, 11, -6, 8, 2.5, 10.5, -4, 6.5, 12,
      4, 8.5, -7, 3, 11.5, 6, -5, 9, 3.5, 7.5
    ];

    const mobileOffsets = [
      -3.5,  3.2, -1.2,   0.0,  2.8,  3.6, -3.0, -3.4,  1.0, -2.2,
       3.4,  1.8, -3.6,   2.5, -2.8, -1.4,  3.5,  0.0, -3.2,  3.0,
       1.2, -1.0,  3.6, -3.5, -1.8,  2.2,  3.2, -2.5,  0.0,  3.4,
      -3.4,  1.5, -2.0, -3.2,  3.6, -1.2,  2.8,  0.0, -3.6,  3.2
    ];

    const AUTO_SPEED = 0.38;
    let currentY = 0;
    let userVelocity = 0;
    let isUserInteracting = false;
    let resumeTimeout = null;
    let groupHeight = 0;

    let startY = 0;
    let lastY = 0;
    let lastTime = 0;
    let isDragThresholdPassed = false;

    function sortImagesByNumericIndex(images) {
      return [...images].sort((a, b) => {
        const nameA = (a.src || '').split('/').pop();
        const nameB = (b.src || '').split('/').pop();
        const matchA = nameA.match(/\d+/);
        const matchB = nameB.match(/\d+/);
        const numA = matchA ? parseInt(matchA[0], 10) : 0;
        const numB = matchB ? parseInt(matchB[0], 10) : 0;
        return numA - numB;
      });
    }

    function extractColors(data) {
      if (Array.isArray(data.colors) && data.colors.length > 0) return data.colors;
      if (typeof data.gradient === 'string' && data.gradient.includes('#')) {
        return data.gradient.match(/#[a-fA-F0-9]{3,8}/g) || ['#f5f5f7'];
      }
      return ['#f5f5f7'];
    }

    function getPhotoPalette(allColors) {
      if (allColors.length > 3) {
        return allColors.slice(2, -1);
      }
      return allColors.filter((_, idx) => idx !== 1);
    }

    function applyMovingGradient(data, count) {
      const colors = extractColors(data);
      if (colors.length === 0) return;
      if (colors.length === 1) {
        track.style.backgroundColor = colors[0];
        return;
      }

      const stopsNeeded = Math.max(count + 2, colors.length);
      const singleCycleColors = [];
      for (let i = 0; i < stopsNeeded; i++) {
        singleCycleColors.push(colors[i % colors.length]);
      }

      const allStops = [];
      singleCycleColors.forEach((col, idx) => {
        const pct = (idx / (stopsNeeded - 1)) * 50;
        allStops.push(`${col} ${pct.toFixed(2)}%`);
      });
      singleCycleColors.forEach((col, idx) => {
        const pct = 50 + (idx / (stopsNeeded - 1)) * 50;
        allStops.push(`${col} ${pct.toFixed(2)}%`);
      });

      track.style.backgroundImage = `linear-gradient(180deg, ${allStops.join(', ')})`;
    }

    function createPhotoElement(item, index, photoColors) {
      const card = document.createElement('div');
      card.className = 'photo-card';

      const pairIndex = Math.floor(index / 2);
      const shiftValue = offsets[pairIndex % offsets.length];
      let itemOffset = 0;
      if (index % 2 === 0) {
        itemOffset = shiftValue < 0 ? Math.abs(shiftValue) : 0;
      } else {
        itemOffset = shiftValue > 0 ? shiftValue : 0;
      }
      card.style.setProperty('--offset', `${itemOffset}rem`);

      const mobileShift = mobileOffsets[index % mobileOffsets.length];
      card.style.setProperty('--x-offset', `${mobileShift}%`);

      const pairColorHex = photoColors[pairIndex % photoColors.length];
      card.style.setProperty('--glow-color', pairColorHex);

      const img = document.createElement('img');
      img.src = item.src;
      img.loading = 'eager';

      img.addEventListener('click', (e) => {
        if (isDragThresholdPassed) return;
        e.stopPropagation();
        openModal(item.src);
      });

      card.appendChild(img);
      return card;
    }

    function openModal(src) {
      modalImg.src = src;
      modal.classList.add('active');
      modal.setAttribute('aria-hidden', 'false');
    }

    function closeModal() {
      modal.classList.remove('active');
      modal.setAttribute('aria-hidden', 'true');
      setTimeout(() => {
        if (!modal.classList.contains('active')) {
          modalImg.src = '';
        }
      }, 300);
    }

    function animate() {
      const measuredHeight = groupOriginal.offsetHeight;
      if (measuredHeight > 0) {
        groupHeight = measuredHeight;
      }

      if (!isUserInteracting) {
        userVelocity *= 0.92;
        if (Math.abs(userVelocity) < 0.05) userVelocity = 0;
        currentY += (AUTO_SPEED + userVelocity);
      }

      if (groupHeight > 0) {
        if (currentY >= groupHeight) {
          currentY %= groupHeight;
        } else if (currentY < 0) {
          currentY = (currentY % groupHeight) + groupHeight;
        }
      }

      track.style.transform = `translate3d(0, ${-currentY}px, 0)`;
      requestAnimationFrame(animate);
    }

    window.addEventListener('wheel', (e) => {
      userVelocity += e.deltaY * 0.15;
      userVelocity = Math.max(-20, Math.min(20, userVelocity));
      
      clearTimeout(resumeTimeout);
      resumeTimeout = setTimeout(() => {
        userVelocity = 0;
      }, 350);
    }, { passive: true });

    function onPointerDown(e) {
      if (e.target.closest('.back-btn') || e.target.closest('.sound-btn')) return;

      isUserInteracting = true;
      isDragThresholdPassed = false;
      startY = e.clientY || (e.touches && e.touches[0].clientY);
      lastY = startY;
      lastTime = performance.now();
      userVelocity = 0;
      clearTimeout(resumeTimeout);
    }

    function onPointerMove(e) {
      if (!isUserInteracting) return;
      const clientY = e.clientY || (e.touches && e.touches[0].clientY);
      const deltaY = lastY - clientY;

      if (Math.abs(clientY - startY) > 6) {
        isDragThresholdPassed = true;
      }

      currentY += deltaY;

      const now = performance.now();
      const dt = Math.max(10, now - lastTime);
      userVelocity = (deltaY / dt) * 16;

      lastY = clientY;
      lastTime = now;
    }

    function onPointerUp() {
      if (!isUserInteracting) return;
      isUserInteracting = false;
      userVelocity = Math.max(-25, Math.min(25, userVelocity));
    }

    window.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    window.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp, { passive: true });

    modal.addEventListener('click', closeModal);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('active')) {
        closeModal();
      }
    });

    async function init() {
      requestAnimationFrame(animate);

      try {
        const res = await fetch('data.json?v=' + Date.now());
        const data = await res.json();
        const rawImages = data.images || [];

        if (rawImages.length === 0) return;

        if (data.audio) {
          currentAudioSrc = data.audio;
          if (playerA && playerB) {
            playerA.src = data.audio;
            playerB.src = data.audio;
          }
        }

        const images = sortImagesByNumericIndex(rawImages);
        const allColors = extractColors(data);
        const photoColors = getPhotoPalette(allColors);

        images.forEach((item, index) => {
          groupOriginal.appendChild(createPhotoElement(item, index, photoColors));
          groupClone.appendChild(createPhotoElement(item, index, photoColors));
        });

        applyMovingGradient(data, Math.ceil(images.length / 2));
        groupHeight = groupOriginal.offsetHeight;

        window.addEventListener('resize', () => {
          groupHeight = groupOriginal.offsetHeight;
        });

      } catch (err) {
        console.error('Ошибка инициализации потока:', err);
      }
    }

    init();
  </script>
</body>
</html>
