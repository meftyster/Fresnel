<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Эффект Френеля — Поток</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0d10;
    }

    /* Окно просмотра на весь экран */
    .stream-viewport {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
    }

    /* 
      Движущийся трек с градиентом, который скользит вместе с кадрами.
      Базовая длительность анимации — 60s (в 2 раза быстрее первоначальных 120s)
    */
    .stream-track {
      position: absolute;
      top: 0;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      will-change: transform;
      animation: infiniteScroll 60s linear infinite;
    }

    /* Пауза при наведении мыши / зажатии */
    .stream-viewport:hover .stream-track {
      animation-play-state: paused;
    }

    /* Группа фотографий (оригинал и бесшовный клон) */
    .stream-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5rem;
      padding-top: 7rem;      /* Комфортный воздух перед первым кадром */
      padding-bottom: 7rem;
      width: 100%;
      max-width: 440px;      /* Ширина центральной ленты */
      padding-left: 1rem;
      padding-right: 1rem;
    }

    .photo-card {
      width: 100%;
      display: flex;
      justify-content: center;
      transform: translateX(var(--x-offset, 0%));
    }

    .photo-card img {
      width: 100%;
      aspect-ratio: 9 / 16;
      object-fit: cover;
      display: block;
      border-radius: 4px;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.6);
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .photo-card img:hover {
      transform: scale(1.02);
    }

    /* Бесшовный цикл: трек смещается ровно на половину высоты */
    @keyframes infiniteScroll {
      0% {
        transform: translateY(0);
      }
      100% {
        transform: translateY(-50%);
      }
    }

    /* Модальное окно */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      padding: 2rem;
    }

    .modal.active {
      display: flex;
    }

    .modal img {
      max-width: 94vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <div class="stream-viewport">
    <div class="stream-track" id="track">
      <!-- Группа 1: Оригинал -->
      <div class="stream-group" id="groupOriginal"></div>
      <!-- Группа 2: Дубликат для бесконечного лупа -->
      <div class="stream-group" id="groupClone" aria-hidden="true"></div>
    </div>
  </div>

  <div class="modal" id="modal">
    <img id="modalImg" src="" alt="Fullscreen">
  </div>

  <script>
    const groupOriginal = document.getElementById('groupOriginal');
    const groupClone = document.getElementById('groupClone');
    const track = document.getElementById('track');
    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modalImg');

    // Синкопированный горизонтальный ритм
    const mobileOffsets = [
      -3.5,  3.2, -1.2,   0.0,  2.8,  3.6, -3.0, -3.4,  1.0, -2.2,
       3.4,  1.8, -3.6,   2.5, -2.8, -1.4,  3.5,  0.0, -3.2,  3.0,
       1.2, -1.0,  3.6, -3.5, -1.8,  2.2,  3.2, -2.5,  0.0,  3.4,
      -3.4,  1.5, -2.0, -3.2,  3.6, -1.2,  2.8,  0.0, -3.6,  3.2
    ];

    // Градиент на всю длину ленты (два идентичных цикла подряд)
    function applyMovingGradient(data, count) {
      let colors = [];
      if (Array.isArray(data.colors) && data.colors.length > 0) {
        colors = data.colors;
      } else if (typeof data.gradient === 'string' && data.gradient.includes('#')) {
        colors = data.gradient.match(/#[a-fA-F0-9]{3,8}/g) || [];
      }

      if (colors.length === 0) return;
      if (colors.length === 1) {
        track.style.backgroundColor = colors[0];
        return;
      }

      const stopsNeeded = Math.max(count + 2, colors.length);
      const singleCycleColors = [];
      for (let i = 0; i < stopsNeeded; i++) {
        singleCycleColors.push(colors[i % colors.length]);
      }

      const allStops = [];
      
      // Первый цикл (0% - 50%)
      singleCycleColors.forEach((col, idx) => {
        const pct = (idx / (stopsNeeded - 1)) * 50;
        allStops.push(`${col} ${pct.toFixed(2)}%`);
      });

      // Второй цикл (50% - 100%)
      singleCycleColors.forEach((col, idx) => {
        const pct = 50 + (idx / (stopsNeeded - 1)) * 50;
        allStops.push(`${col} ${pct.toFixed(2)}%`);
      });

      track.style.backgroundImage = `linear-gradient(180deg, ${allStops.join(', ')})`;
    }

    function createPhotoElement(item, index) {
      const card = document.createElement('div');
      card.className = 'photo-card';

      const shift = mobileOffsets[index % mobileOffsets.length];
      card.style.setProperty('--x-offset', `${shift}%`);

      const img = document.createElement('img');
      img.src = item.src;
      img.loading = 'lazy';

      img.addEventListener('click', (e) => {
        e.stopPropagation();
        modalImg.src = item.src;
        modal.classList.add('active');
      });

      card.appendChild(img);
      return card;
    }

    async function init() {
      try {
        const res = await fetch('data.json?v=' + Date.now());
        const data = await res.json();
        const images = data.images || [];

        if (images.length === 0) return;

        images.forEach((item, index) => {
          groupOriginal.appendChild(createPhotoElement(item, index));
          groupClone.appendChild(createPhotoElement(item, index));
        });

        // Скорость ровно в 2 раза быстрее изначальной (60s базовое время, ~2.2s на кадр)
        const totalDuration = Math.max(60, images.length * 2.2);
        track.style.animationDuration = `${totalDuration}s`;

        // Навешиваем градиент на ленту
        applyMovingGradient(data, images.length);

      } catch (err) {
        console.error('Ошибка инициализации потока:', err);
      }
    }

    modal.addEventListener('click', () => modal.classList.remove('active'));
    init();
  </script>
</body>
</html>
