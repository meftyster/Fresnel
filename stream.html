<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Эффект Френеля — Поток</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0d10;
      touch-action: none;
      user-select: none;
    }

    /* Окно просмотра */
    .stream-viewport {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      cursor: grab;
    }

    .stream-viewport:active {
      cursor: grabbing;
    }

    /* Движущийся трек */
    .stream-track {
      position: absolute;
      top: 0;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      will-change: transform;
    }

    /* Группа фотографий */
    .stream-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5rem;
      padding-top: 7rem;
      padding-bottom: 7rem;
      width: 100%;
      max-width: 440px;
      padding-left: 1rem;
      padding-right: 1rem;
    }

    .photo-card {
      width: 100%;
      display: flex;
      justify-content: center;
      transform: translateX(var(--x-offset, 0%));
    }

    .photo-card img {
      width: 100%;
      aspect-ratio: 9 / 16;
      object-fit: cover;
      display: block;
      border-radius: 4px;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.6);
      cursor: pointer;
      pointer-events: auto;
      transition: transform 0.3s ease;
    }

    .photo-card img:hover {
      transform: scale(1.02);
    }

    /* Модальное окно */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      padding: 2rem;
    }

    .modal.active {
      display: flex;
    }

    .modal img {
      max-width: 94vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <div class="stream-viewport" id="viewport">
    <div class="stream-track" id="track">
      <!-- Группа 1: Оригинал -->
      <div class="stream-group" id="groupOriginal"></div>
      <!-- Группа 2: Дубликат для бесконечного цикла -->
      <div class="stream-group" id="groupClone" aria-hidden="true"></div>
    </div>
  </div>

  <div class="modal" id="modal">
    <img id="modalImg" src="" alt="Fullscreen">
  </div>

  <script>
    const viewport = document.getElementById('viewport');
    const track = document.getElementById('track');
    const groupOriginal = document.getElementById('groupOriginal');
    const groupClone = document.getElementById('groupClone');
    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modalImg');

    const mobileOffsets = [
      -3.5,  3.2, -1.2,   0.0,  2.8,  3.6, -3.0, -3.4,  1.0, -2.2,
       3.4,  1.8, -3.6,   2.5, -2.8, -1.4,  3.5,  0.0, -3.2,  3.0,
       1.2, -1.0,  3.6, -3.5, -1.8,  2.2,  3.2, -2.5,  0.0,  3.4,
      -3.4,  1.5, -2.0, -3.2,  3.6, -1.2,  2.8,  0.0, -3.6,  3.2
    ];

    // Ровно на 10% быстрее исходной медитативной скорости
    const AUTO_SPEED = 0.38;        // пикселей за кадр (~22-24 px в секунду)
    let currentY = 0;
    let userVelocity = 0;
    let isUserInteracting = false;
    let resumeTimeout = null;
    let groupHeight = 0;

    let startY = 0;
    let lastY = 0;
    let lastTime = 0;
    let isDragThresholdPassed = false;

    function applyMovingGradient(data, count) {
      let colors = [];
      if (Array.isArray(data.colors) && data.colors.length > 0) {
        colors = data.colors;
      } else if (typeof data.gradient === 'string' && data.gradient.includes('#')) {
        colors = data.gradient.match(/#[a-fA-F0-9]{3,8}/g) || [];
      }

      if (colors.length === 0) return;
      if (colors.length === 1) {
        track.style.backgroundColor = colors[0];
        return;
      }

      const stopsNeeded = Math.max(count + 2, colors.length);
      const singleCycleColors = [];
      for (let i = 0; i < stopsNeeded; i++) {
        singleCycleColors.push(colors[i % colors.length]);
      }

      const allStops = [];
      singleCycleColors.forEach((col, idx) => {
        const pct = (idx / (stopsNeeded - 1)) * 50;
        allStops.push(`${col} ${pct.toFixed(2)}%`);
      });
      singleCycleColors.forEach((col, idx) => {
        const pct = 50 + (idx / (stopsNeeded - 1)) * 50;
        allStops.push(`${col} ${pct.toFixed(2)}%`);
      });

      track.style.backgroundImage = `linear-gradient(180deg, ${allStops.join(', ')})`;
    }

    function createPhotoElement(item, index) {
      const card = document.createElement('div');
      card.className = 'photo-card';

      const shift = mobileOffsets[index % mobileOffsets.length];
      card.style.setProperty('--x-offset', `${shift}%`);

      const img = document.createElement('img');
      img.src = item.src;
      img.loading = 'eager';

      img.addEventListener('click', (e) => {
        if (isDragThresholdPassed) return;
        e.stopPropagation();
        modalImg.src = item.src;
        modal.classList.add('active');
      });

      card.appendChild(img);
      return card;
    }

    // Главный цикл: стартует немедленно
    function animate() {
      // Обновляем фактическую высоту блока динамически
      const measuredHeight = groupOriginal.offsetHeight;
      if (measuredHeight > 0) {
        groupHeight = measuredHeight;
      }

      if (!isUserInteracting) {
        userVelocity *= 0.92;
        if (Math.abs(userVelocity) < 0.05) userVelocity = 0;
        currentY += (AUTO_SPEED + userVelocity);
      }

      // Бесшовный цикл
      if (groupHeight > 0) {
        if (currentY >= groupHeight) {
          currentY %= groupHeight;
        } else if (currentY < 0) {
          currentY = (currentY % groupHeight) + groupHeight;
        }
      }

      track.style.transform = `translate3d(0, ${-currentY}px, 0)`;
      requestAnimationFrame(animate);
    }

    // Обработка колеса мыши и трекпада
    window.addEventListener('wheel', (e) => {
      userVelocity += e.deltaY * 0.15;
      userVelocity = Math.max(-20, Math.min(20, userVelocity));
      
      clearTimeout(resumeTimeout);
      resumeTimeout = setTimeout(() => {
        userVelocity = 0;
      }, 350);
    }, { passive: true });

    // Обработка тач-свайпов и мыши
    function onPointerDown(e) {
      isUserInteracting = true;
      isDragThresholdPassed = false;
      startY = e.clientY || (e.touches && e.touches[0].clientY);
      lastY = startY;
      lastTime = performance.now();
      userVelocity = 0;
      clearTimeout(resumeTimeout);
    }

    function onPointerMove(e) {
      if (!isUserInteracting) return;
      const clientY = e.clientY || (e.touches && e.touches[0].clientY);
      const deltaY = lastY - clientY;

      if (Math.abs(clientY - startY) > 6) {
        isDragThresholdPassed = true;
      }

      currentY += deltaY;

      const now = performance.now();
      const dt = Math.max(10, now - lastTime);
      userVelocity = (deltaY / dt) * 16;

      lastY = clientY;
      lastTime = now;
    }

    function onPointerUp() {
      if (!isUserInteracting) return;
      isUserInteracting = false;
      userVelocity = Math.max(-25, Math.min(25, userVelocity));
    }

    window.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    window.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp, { passive: true });

    async function init() {
      // Запускаем анимацию сразу же
      requestAnimationFrame(animate);

      try {
        const res = await fetch('data.json?v=' + Date.now());
        const data = await res.json();
        const images = data.images || [];

        if (images.length === 0) return;

        images.forEach((item, index) => {
          groupOriginal.appendChild(createPhotoElement(item, index));
          groupClone.appendChild(createPhotoElement(item, index));
        });

        applyMovingGradient(data, images.length);
        groupHeight = groupOriginal.offsetHeight;

      } catch (err) {
        console.error('Ошибка инициализации потока:', err);
      }
    }

    modal.addEventListener('click', () => modal.classList.remove('active'));
    init();
  </script>
</body>
</html>
