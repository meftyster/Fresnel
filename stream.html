<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Эффект Френеля — Поток</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0d10;
      touch-action: none;
      user-select: none;
    }

    /* ==========================================================================
       МИНИМАЛИСТИЧНАЯ КНОПКА «НАЗАД» С АВТОСКРЫТИЕМ
       ========================================================================== */
    .back-btn {
      position: fixed;
      top: 1.8rem;
      left: 1.8rem;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(11, 13, 16, 0.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(245, 245, 247, 0.08);
      color: rgba(245, 245, 247, 0.6);
      text-decoration: none;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transform: scale(0.92);
      transition: opacity 0.5s cubic-bezier(0.2, 0, 0, 1),
                  transform 0.5s cubic-bezier(0.2, 0, 0, 1),
                  visibility 0.5s ease,
                  color 0.25s ease,
                  background 0.25s ease,
                  border-color 0.25s ease;
    }

    /* Состояние активности при взаимодействии */
    .back-btn.visible {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
    }

    .back-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: transform 0.25s ease;
    }

    .back-btn:hover {
      color: #f3dfc0;
      background: rgba(20, 24, 30, 0.75);
      border-color: rgba(243, 223, 192, 0.3);
    }

    .back-btn:hover svg {
      transform: translateX(-2px);
    }

    /* Окно просмотра на весь экран */
    .stream-viewport {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      cursor: grab;
    }

    .stream-viewport:active {
      cursor: grabbing;
    }

    /* Трек виртуального скролла */
    .stream-track {
      position: absolute;
      top: 0;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      will-change: transform;
    }

    /* ==========================================================================
       ДЕСКТОП: Двухколоночная сетка 1080px
       ========================================================================== */
    .stream-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 4.5rem;
      row-gap: 8rem;
      width: 100%;
      max-width: 1080px;
      padding: 8rem 2rem;
    }

    .photo-card {
      display: flex;
      flex-direction: column;
      margin-top: var(--offset, 0rem);
    }

    .photo-card img {
      width: 100%;
      aspect-ratio: 9 / 16;
      object-fit: cover;
      display: block;
      border-radius: 4px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      cursor: pointer;
      pointer-events: auto;
      transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.3s ease;
    }

    .photo-card img:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.6);
    }

    /* ==========================================================================
       МОБИЛЬНАЯ ВЕРСИЯ (Экран <= 768px)
       ========================================================================== */
    @media (max-width: 768px) {
      .back-btn {
        top: 1.2rem;
        left: 1.2rem;
        width: 38px;
        height: 38px;
      }

      .back-btn svg {
        width: 16px;
        height: 16px;
      }

      .stream-group {
        display: flex;
        flex-direction: column;
        align-items: center;
        row-gap: 5rem;
        column-gap: 0;
        max-width: 100%;
        padding: 6rem 1rem;
      }

      .photo-card {
        margin-top: 0 !important;
        width: 91%;
        max-width: 430px;
        transform: translateX(var(--x-offset, 0%));
      }

      .photo-card img {
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
      }
    }

    /* Модальное окно */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      padding: 2rem;
    }

    .modal.active {
      display: flex;
    }

    .modal img {
      max-width: 94vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <!-- Круглая кнопка возврата (изначально скрыта) -->
  <a href="index.html" class="back-btn" id="backBtn" aria-label="Назад к галерее">
    <svg viewBox="0 0 24 24">
      <line x1="19" y1="12" x2="5" y2="12"></line>
      <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
  </a>

  <div class="stream-viewport" id="viewport">
    <div class="stream-track" id="track">
      <!-- Группа 1: Оригинал -->
      <div class="stream-group" id="groupOriginal"></div>
      <!-- Группа 2: Дубликат для бесконечного лупа -->
      <div class="stream-group" id="groupClone" aria-hidden="true"></div>
    </div>
  </div>

  <div class="modal" id="modal">
    <img id="modalImg" src="" alt="Fullscreen">
  </div>

  <script>
    const viewport = document.getElementById('viewport');
    const track = document.getElementById('track');
    const groupOriginal = document.getElementById('groupOriginal');
    const groupClone = document.getElementById('groupClone');
    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modalImg');
    const backBtn = document.getElementById('backBtn');

    // Логика плавного автоскрытия кнопки "назад"
    let uiTimeout = null;
    let isCursorOverBackBtn = false;

    function showUI() {
      backBtn.classList.add('visible');
      clearTimeout(uiTimeout);
      
      // Скрываем через 2.2 секунды покоя, если курсор не наведен на саму кнопку
      if (!isCursorOverBackBtn) {
        uiTimeout = setTimeout(() => {
          backBtn.classList.remove('visible');
        }, 2200);
      }
    }

    // Слушатели активности: кнопка покажется только при движении или касании
    window.addEventListener('mousemove', showUI);
    window.addEventListener('touchstart', showUI, { passive: true });
    window.addEventListener('wheel', showUI, { passive: true });

    backBtn.addEventListener('mouseenter', () => {
      isCursorOverBackBtn = true;
      clearTimeout(uiTimeout);
      backBtn.classList.add('visible');
    });

    backBtn.addEventListener('mouseleave', () => {
      isCursorOverBackBtn = false;
      showUI();
    });

    // Десктопные вертикальные оффсеты пар
    const offsets = [
      7, 3.5, 11, -6, 8, 2.5, 10.5, -4, 6.5, 12,
      4, 8.5, -7, 3, 11.5, 6, -5, 9, 3.5, 7.5
    ];

    // Синкопированный горизонтальный ритм
    const mobileOffsets = [
      -3.5,  3.2, -1.2,   0.0,  2.8,  3.6, -3.0, -3.4,  1.0, -2.2,
       3.4,  1.8, -3.6,   2.5, -2.8, -1.4,  3.5,  0.0, -3.2,  3.0,
       1.2, -1.0,  3.6, -3.5, -1.8,  2.2,  3.2, -2.5,  0.0,  3.4,
      -3.4,  1.5, -2.0, -3.2,  3.6, -1.2,  2.8,  0.0, -3.6,  3.2
    ];

    // Скорость: на 10% быстрее базовой медитативной
    const AUTO_SPEED = 0.38;
    let currentY = 0;
    let userVelocity = 0;
    let isUserInteracting = false;
    let resumeTimeout = null;
    let groupHeight = 0;

    let startY = 0;
    let lastY = 0;
    let lastTime = 0;
    let isDragThresholdPassed = false;

    function applyMovingGradient(data, count) {
      let colors = [];
      if (Array.isArray(data.colors) && data.colors.length > 0) {
        colors = data.colors;
      } else if (typeof data.gradient === 'string' && data.gradient.includes('#')) {
        colors = data.gradient.match(/#[a-fA-F0-9]{3,8}/g) || [];
      }

      if (colors.length === 0) return;
      if (colors.length === 1) {
        track.style.backgroundColor = colors[0];
        return;
      }

      const stopsNeeded = Math.max(count + 2, colors.length);
      const singleCycleColors = [];
      for (let i = 0; i < stopsNeeded; i++) {
        singleCycleColors.push(colors[i % colors.length]);
      }

      const allStops = [];
      singleCycleColors.forEach((col, idx) => {
        const pct = (idx / (stopsNeeded - 1)) * 50;
        allStops.push(`${col} ${pct.toFixed(2)}%`);
      });
      singleCycleColors.forEach((col, idx) => {
        const pct = 50 + (idx / (stopsNeeded - 1)) * 50;
        allStops.push(`${col} ${pct.toFixed(2)}%`);
      });

      track.style.backgroundImage = `linear-gradient(180deg, ${allStops.join(', ')})`;
    }

    function createPhotoElement(item, index) {
      const card = document.createElement('div');
      card.className = 'photo-card';

      const pairIndex = Math.floor(index / 2);
      const shiftValue = offsets[pairIndex % offsets.length];
      let itemOffset = 0;
      if (index % 2 === 0) {
        itemOffset = shiftValue < 0 ? Math.abs(shiftValue) : 0;
      } else {
        itemOffset = shiftValue > 0 ? shiftValue : 0;
      }
      card.style.setProperty('--offset', `${itemOffset}rem`);

      const mobileShift = mobileOffsets[index % mobileOffsets.length];
      card.style.setProperty('--x-offset', `${mobileShift}%`);

      const img = document.createElement('img');
      img.src = item.src;
      img.loading = 'eager';

      img.addEventListener('click', (e) => {
        if (isDragThresholdPassed) return;
        e.stopPropagation();
        modalImg.src = item.src;
        modal.classList.add('active');
      });

      card.appendChild(img);
      return card;
    }

    function animate() {
      const measuredHeight = groupOriginal.offsetHeight;
      if (measuredHeight > 0) {
        groupHeight = measuredHeight;
      }

      if (!isUserInteracting) {
        userVelocity *= 0.92;
        if (Math.abs(userVelocity) < 0.05) userVelocity = 0;
        currentY += (AUTO_SPEED + userVelocity);
      }

      if (groupHeight > 0) {
        if (currentY >= groupHeight) {
          currentY %= groupHeight;
        } else if (currentY < 0) {
          currentY = (currentY % groupHeight) + groupHeight;
        }
      }

      track.style.transform = `translate3d(0, ${-currentY}px, 0)`;
      requestAnimationFrame(animate);
    }

    window.addEventListener('wheel', (e) => {
      userVelocity += e.deltaY * 0.15;
      userVelocity = Math.max(-20, Math.min(20, userVelocity));
      
      clearTimeout(resumeTimeout);
      resumeTimeout = setTimeout(() => {
        userVelocity = 0;
      }, 350);
    }, { passive: true });

    function onPointerDown(e) {
      if (e.target.closest('.back-btn')) return;

      isUserInteracting = true;
      isDragThresholdPassed = false;
      startY = e.clientY || (e.touches && e.touches[0].clientY);
      lastY = startY;
      lastTime = performance.now();
      userVelocity = 0;
      clearTimeout(resumeTimeout);
    }

    function onPointerMove(e) {
      if (!isUserInteracting) return;
      const clientY = e.clientY || (e.touches && e.touches[0].clientY);
      const deltaY = lastY - clientY;

      if (Math.abs(clientY - startY) > 6) {
        isDragThresholdPassed = true;
      }

      currentY += deltaY;

      const now = performance.now();
      const dt = Math.max(10, now - lastTime);
      userVelocity = (deltaY / dt) * 16;

      lastY = clientY;
      lastTime = now;
    }

    function onPointerUp() {
      if (!isUserInteracting) return;
      isUserInteracting = false;
      userVelocity = Math.max(-25, Math.min(25, userVelocity));
    }

    window.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    window.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp, { passive: true });

    async function init() {
      // Запуск анимации потока
      requestAnimationFrame(animate);

      try {
        const res = await fetch('data.json?v=' + Date.now());
        const data = await res.json();
        const images = data.images || [];

        if (images.length === 0) return;

        images.forEach((item, index) => {
          groupOriginal.appendChild(createPhotoElement(item, index));
          groupClone.appendChild(createPhotoElement(item, index));
        });

        applyMovingGradient(data, Math.ceil(images.length / 2));
        groupHeight = groupOriginal.offsetHeight;

        window.addEventListener('resize', () => {
          groupHeight = groupOriginal.offsetHeight;
        });

      } catch (err) {
        console.error('Ошибка инициализации потока:', err);
      }
    }

    modal.addEventListener('click', () => modal.classList.remove('active'));
    init();
  </script>
</body>
</html>
