name: Generate Gallery Data & Update PWA

on:
  push:
    branches:
      - main
    paths:
      - 'content.md'
      - 'gradient.txt'
      - 'images/**'
      - 'styles.css'
      - 'index.html'
      - 'stream.html'
      - 'gallery-core.js'
      - 'manifest.json'
      - '.github/workflows/generate-gallery.yml'
  workflow_dispatch:

concurrency:
  group: generate-gallery-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate data.json from content.md, images & gradient.txt
        run: |
          python3 - << 'EOF'
          import os
          import json
          import re

          title = "Галерея"
          description = ""
          footer = ""

          # 1. Читаем content.md
          if os.path.exists("content.md"):
              with open("content.md", "r", encoding="utf-8") as f:
                  raw = f.read().strip()

              parts = re.split(r'\n\s*---\s*\n', raw, maxsplit=1)
              main_text = parts[0].strip()
              if len(parts) > 1:
                  footer = parts[1].strip()

              lines = main_text.splitlines()
              desc_lines = []
              for line in lines:
                  if line.startswith("# ") and title == "Галерея":
                      title = line[2:].strip()
                  else:
                      desc_lines.append(line)
              description = "\n".join(desc_lines).strip()

          # 2. Собираем фотографии из images/
          images = []
          img_dir = "images"
          if os.path.isdir(img_dir):
              valid_exts = {".jpg", ".jpeg", ".png", ".webp", ".avif"}
              files = sorted(os.listdir(img_dir))
              for file in files:
                  ext = os.path.splitext(file)[1].lower()
                  if ext in valid_exts:
                      images.append({"src": f"images/{file}"})

          # 3. Читаем палитру из gradient.txt
          colors = []
          if os.path.exists("gradient.txt"):
              try:
                  with open("gradient.txt", "r", encoding="utf-8") as f:
                      content = f.read()
                      found_colors = re.findall(r'#[a-fA-F0-9]{3,8}', content)
                      if found_colors:
                          colors = found_colors
              except Exception as e:
                  print(f"Ошибка чтения gradient.txt: {e}")

          output_data = {
              "title": title,
              "description": description,
              "footer": footer,
              "images": images
          }
          if colors:
              output_data["colors"] = colors

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(output_data, f, ensure_ascii=False, indent=2)

          print("data.json successfully generated!")
          EOF

      - name: Auto-update Service Worker Cache Version
        run: |
          if [ -f "sw.js" ]; then
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            BUILD_DATE=$(date -u +"%Y%m%d%H%M")
            NEW_VERSION="fresnel-${BUILD_DATE}-${SHORT_SHA}"
            sed -i -E "s/const CACHE_NAME = ['\"][^'\"]+['\"];/const CACHE_NAME = '${NEW_VERSION}';/" sw.js
            echo "CACHE_NAME в sw.js обновлен на: ${NEW_VERSION}"
          fi

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add data.json sw.js
          if git diff --cached --quiet; then
            echo "Файлы data.json и sw.js не изменились"
            exit 0
          fi

          git stash push -m "generated-artifacts" data.json sw.js
          git fetch origin main
          git reset --hard origin/main
          git stash pop
          git add data.json sw.js
          git commit -m "Auto-update data.json & sw.js cache [skip ci]"
          git push origin main
