name: Generate Gallery Data

on:
  push:
    branches:
      - main
    paths:
      - 'content.md'
      - 'images/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run generation script
        run: |
          if [ -f scripts/generate.py ]; then
            python scripts/generate.py
          elif [ -f generate.py ]; then
            python generate.py
          elif [ -f scripts/build.py ]; then
            python scripts/build.py
          fi

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add data.json
          
          # Коммитим только если data.json действительно изменился
          if ! git diff-index --quiet HEAD --; then
            git commit -m "Auto-generate data.json [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes in data.json to commit"
          fi
