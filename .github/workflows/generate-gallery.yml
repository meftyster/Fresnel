name: Generate Gallery Data

on:
  push:
    branches:
      - main
    paths:
      - 'content.md'
      - 'images/**'
      - 'scripts/**'
  workflow_dispatch:

# Отменяем старые параллельные запуски, чтобы они не мешали друг другу пушить
concurrency:
  group: generate-gallery-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run generation script
        run: |
          if [ -f scripts/generate.py ]; then
            python scripts/generate.py
          elif [ -f generate.py ]; then
            python generate.py
          elif [ -f scripts/build.py ]; then
            python scripts/build.py
          fi

      - name: Commit and push data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Проверяем, изменился ли data.json
          git status
          if git diff --quiet data.json; then
            echo "Файл data.json не изменился"
            exit 0
          fi

          # Прячем готовый data.json в stash
          git add data.json
          git stash push -m "generated-data" data.json

          # Забираем самое актуальное состояние ветки
          git fetch origin main
          git reset --hard origin/main

          # Достаем наш data.json поверх актуального состояния
          git stash pop

          git add data.json
          git commit -m "Auto-generate data.json [skip ci]"
          git push origin main
